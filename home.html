<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen max-w-md bg-base-200 px-8 py-4 mx-auto">
    <header class="flex flex-row justify-between mt-10 items-center sticky top-0 bg-base-200">
        <div class="flex flex-row gap-4">
            <div class="">
                <img src="./images/logo.png" class="w-16 h-14" alt="">
            </div>

            <div class="flex flex-col">
                <p class="text-xl font-bold">$<span id="balance">45000</span></p>
                <p class="text-sm text-[#777]">Available Balance</p>
            </div>
        </div>

        <div class="flex justify-center items-center">
            <a href="index.html" class="btn btn-soft text-center"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </header>

    <section class="mt-14">
        <h1 class=" text-2xl font-bold">Welcome To Pay<span class="text-purple-700">oo</span></h1>
        <p class="mt-5 text-[16px] text-[#777]">Enjoy easy and convenient financial services with us. Cashout charge is low and no hidden fees.</p>
    </section>

    <div class="buttons mt-12 grid grid-cols-3 gap-4">
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-1.png" alt="">
            <p>Add Money</p>
        </div>
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-2.png" alt="">
            <p>Cashout</p>
        </div>
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-3.png" alt="">
            <p>Transfer Money</p>
        </div>
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-4.png" alt="">
            <p>Get Bonus</p>
        </div>
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-5.png" alt="">
            <p>Pay Bill</p>
        </div>
        <div class="button1 flex flex-col items-center btn btn-soft gap-2 h-full py-4 ">
            <img src="./images/opt-6.png" alt="">
            <p>Transactions</p>
        </div>
    </div>


    <!----------------------- Add Money ------------------------>

    <section id="add-money" class="mt-10">
        <h2 class="font-bold text-xl">Add Money</h2>
        <div class="card-body pl-3 bg-base-100 rounded-xl">
                <fieldset class="fieldset">

                    <label class="label text-neutral font-bold">Select Bank</label>
                    <select id="add-money-bank" class="select w-full bg-base-200 rounded-full outline-none">
                        <option disabled selected value="ISLAMI">Islami</option>
                        <option value="DBBL">DBBL</option>
                        <option value="CITY">City</option>
                        <option value="SONALI">Sonali</option>
                    </select>

                    <label class="label text-neutral font-bold mt-6">Bank Account Number</label>
                    <input id="add-money-number" type="number"
                        class="input rounded-full bg-base-200 border-0 outline-none"
                        placeholder="Enter 11 digit Account Number" />

                    <br>

                    <label class="label text-neutral font-bold">Amount To Add</label>
                    <input id="add-money-amount" type="text" maxlength="10" class="border-0 outline-none input rounded-full bg-base-200"
                        placeholder="Add Amount To Add" />
                        <br>
                    <label class="label text-neutral font-bold">4 Digit Pin</label>
                    <input id="add-money-pin" type="password" maxlength="4" class="border-0 outline-none input rounded-full bg-base-200"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                </fieldset>
            </div>
    </section>

    <!----------------------- Cashout ------------------------>

    <section id="cashout" class="mt-10 hidden">
        <div class="card  w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
            <h2 class="font-bold text-xl">Cashout</h2>
            <div class="card-body pl-3 bg-base-100 rounded-xl">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Agent Number</label>
                    <input id="cashout-number" type="number"
                        class="input rounded-full bg-base-200 border-0 outline-none"
                        placeholder="Enter 11 digit Number" />

                    <br>

                    <label class="label text-neutral font-bold">Amount</label>
                    <input id="cashout-amount" type="text" maxlength="10" class="border-0 outline-none input rounded-full bg-base-200"
                        placeholder="Enter Amount" />
                        <br>
                    <label class="label text-neutral font-bold">4 Digit Pin</label>
                    <input id="input-pin" type="password" maxlength="4" class="border-0 outline-none input rounded-full bg-base-200"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
                </fieldset>
            </div>
        </div>
    </section>

    



    <script src="./script/machine.js"></script>
    <script src="./script/cashout.js"></script>
    
</body>
</html>
